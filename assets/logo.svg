<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 128" width="400" height="128">
  <defs>
    <!-- Matching glow effect scaled for the smaller icon -->
    <filter id="spikeGlowLogo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Group (Scaled to fit a 96x96 space with padding) -->
  <g transform="translate(16, 16) scale(0.375)">
    <rect width="256" height="256" rx="56" fill="#0B0E14" />
    <rect width="252" height="252" x="2" y="2" rx="54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
    <circle cx="128" cy="128" r="84" fill="none" stroke="#2899F5" stroke-width="12" stroke-linecap="round" stroke-dasharray="380 147" transform="rotate(135 128 128)" />
    <circle cx="128" cy="128" r="60" fill="none" stroke="#FFB900" stroke-width="12" stroke-linecap="round" stroke-dasharray="220 156" transform="rotate(90 128 128)" />
    <circle cx="128" cy="128" r="36" fill="none" stroke="#E81123" stroke-width="12" stroke-linecap="round" stroke-dasharray="120 106" transform="rotate(45 128 128)" filter="url(#spikeGlowLogo)" />
    <path d="M 90 128 L 106 128 L 118 96 L 138 160 L 150 128 L 166 128" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- Brand Typography (Native Windows Font Stack) -->
  <text x="132" y="82" font-family="'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Pulse</tspan><tspan fill="#2899F5">Guard</tspan>
  </text>
</svg>
