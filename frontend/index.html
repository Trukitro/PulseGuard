<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseGuard</title>
    <link rel="icon" href="/assets/icon.ico" />
    <link rel="stylesheet" href="css/tokens.css" />
    <style>
      body {
        padding: var(--pg-space-4);
        display: flex;
        flex-direction: column;
        gap: var(--pg-space-4);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header img {
        height: 40px;
        display: block;
      }
      .ring-cluster {
        display: flex;
        justify-content: center;
        gap: var(--pg-space-5);
        padding: var(--pg-space-4);
      }
      .panel {
        padding: var(--pg-space-3);
      }
      .panel h2 {
        margin: 0 0 var(--pg-space-2) 0;
        font-size: 13px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--pg-text-dim);
      }
      #settings-panel {
        display: flex;
        flex-direction: column;
        gap: var(--pg-space-3);
        max-width: 340px;
      }
      #settings-panel[hidden] {
        display: none;
      }
      #settings-panel .settings-group {
        display: flex;
        flex-direction: column;
        gap: var(--pg-space-2);
        padding: var(--pg-space-3);
      }
      #settings-panel h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--pg-text-dim);
      }
      #settings-panel label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: var(--pg-text-dim);
      }
      #settings-panel label.switch-row {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
      #settings-footer {
        display: flex;
        flex-direction: column;
        gap: var(--pg-space-2);
        padding: var(--pg-space-3);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/assets/logo.svg" alt="PulseGuard" />
      <fluent-button id="settings-toggle" appearance="outline">Settings</fluent-button>
    </header>

    <div id="settings-panel" hidden>
      <fluent-card class="settings-group">
        <h3>RAM</h3>
        <label>
          Ceiling (%)
          <fluent-text-field id="field-ram-ceiling" type="number"></fluent-text-field>
        </label>
        <label>
          Delta threshold (GB)
          <fluent-text-field id="field-ram-delta" type="number"></fluent-text-field>
        </label>
      </fluent-card>

      <fluent-card class="settings-group">
        <h3>CPU</h3>
        <label>
          Ceiling (%)
          <fluent-text-field id="field-cpu-ceiling" type="number"></fluent-text-field>
        </label>
        <label>
          Delta threshold (points)
          <fluent-text-field id="field-cpu-delta" type="number"></fluent-text-field>
        </label>
      </fluent-card>

      <fluent-card class="settings-group">
        <h3>GPU</h3>
        <label>
          Ceiling (%)
          <fluent-text-field id="field-gpu-ceiling" type="number"></fluent-text-field>
        </label>
        <label>
          Delta threshold (points)
          <fluent-text-field id="field-gpu-delta" type="number"></fluent-text-field>
        </label>
      </fluent-card>

      <fluent-card class="settings-group">
        <h3>General</h3>
        <label class="switch-row">
          Notifications
          <fluent-switch id="field-notifications"></fluent-switch>
        </label>
      </fluent-card>

      <fluent-card id="settings-footer">
        <label>
          Poll interval (s)
          <fluent-text-field id="field-poll" type="number"></fluent-text-field>
        </label>
        <fluent-button id="settings-save" appearance="accent">Save</fluent-button>
      </fluent-card>
    </div>

    <section class="ring-cluster pg-panel">
      <pulse-ring id="ring-ram" label="RAM"></pulse-ring>
      <pulse-ring id="ring-cpu" label="CPU"></pulse-ring>
      <pulse-ring id="ring-gpu" label="GPU"></pulse-ring>
    </section>

    <section class="pg-panel panel">
      <h2>Timeline</h2>
      <spike-chart id="chart"></spike-chart>
    </section>

    <fluent-card class="panel">
      <h2>Top processes at last spike</h2>
      <process-list id="process-list"></process-list>
    </fluent-card>

    <alert-toast id="toast"></alert-toast>

    <script src="vendor/chart.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
