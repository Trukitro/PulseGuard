<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseGuard</title>
    <link rel="icon" href="/assets/icon.ico" />
    <link rel="stylesheet" href="css/tokens.css" />
    <style>
      body {
        padding: var(--pg-space-4);
        display: flex;
        flex-direction: column;
        gap: var(--pg-space-4);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header img {
        height: 40px;
        display: block;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: var(--pg-space-3);
      }
      #live-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--pg-text-dim);
      }
      #live-indicator .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--pg-accent);
        flex: none;
      }
      #live-indicator[data-flash] .dot {
        animation: pg-heartbeat 0.6s ease-out;
      }
      @keyframes pg-heartbeat {
        0% {
          box-shadow: 0 0 0 0 var(--pg-accent-glow);
        }
        100% {
          box-shadow: 0 0 0 8px rgba(0, 0, 0, 0);
        }
      }
      #live-indicator[data-state="stale"] .dot {
        background: var(--pg-warn);
      }
      #live-indicator[data-state="stale"] .label {
        color: var(--pg-warn);
      }
      #live-indicator[data-state="disconnected"] .dot {
        background: var(--pg-danger);
      }
      #live-indicator[data-state="disconnected"] .label {
        color: var(--pg-danger);
      }
      .ring-cluster {
        display: flex;
        justify-content: center;
        gap: var(--pg-space-5);
        padding: var(--pg-space-4);
      }
      .io-cluster {
        display: flex;
        flex-wrap: wrap;
        gap: var(--pg-space-3);
      }
      .io-card {
        flex: 1 1 200px;
        padding: var(--pg-space-3);
      }
      .io-card h3 {
        margin: 0 0 var(--pg-space-2) 0;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--pg-text-dim);
      }
      .io-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        padding: 4px 0;
      }
      .io-label {
        color: var(--pg-text-dim);
      }
      .io-value {
        font-variant-numeric: tabular-nums;
      }
      #mini-restore {
        display: none;
        position: fixed;
        top: 6px;
        right: 6px;
        z-index: 1000;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid var(--pg-panel-border);
        border-radius: 6px;
        background: var(--pg-panel-bg);
        color: var(--pg-text-dim);
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
      }
      body.mini-mode {
        padding: 0;
        gap: 0;
        background: transparent;
      }
      body.mini-mode header,
      body.mini-mode #settings-panel,
      body.mini-mode .panel,
      body.mini-mode alert-toast {
        display: none !important;
      }
      body.mini-mode .ring-cluster {
        padding: var(--pg-space-3);
        border-radius: var(--pg-radius);
      }
      body.mini-mode #mini-restore {
        display: block;
      }
      .panel {
        padding: var(--pg-space-3);
      }
      .panel h2 {
        margin: 0 0 var(--pg-space-2) 0;
        font-size: 13px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--pg-text-dim);
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .panel-header h2 {
        margin: 0;
      }
      .panel-header .switch-row {
        display: flex;
        align-items: center;
        gap: var(--pg-space-2);
        font-size: 12px;
        color: var(--pg-text-dim);
        margin-bottom: var(--pg-space-2);
      }
      #settings-panel {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: var(--pg-space-3);
      }
      #settings-panel[hidden] {
        display: none;
      }
      #settings-panel .settings-group,
      #settings-panel #settings-footer {
        flex: 1 1 240px;
        max-width: 280px;
      }
      #settings-panel .settings-group {
        display: flex;
        flex-direction: column;
        gap: var(--pg-space-2);
        padding: var(--pg-space-3);
      }
      #settings-panel h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--pg-text-dim);
      }
      #settings-panel label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: var(--pg-text-dim);
      }
      #settings-panel label.switch-row {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
      #settings-footer {
        display: flex;
        flex-direction: column;
        gap: var(--pg-space-2);
        padding: var(--pg-space-3);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/assets/logo.svg" alt="PulseGuard" />
      <div class="header-right">
        <div id="live-indicator" data-state="live">
          <span class="dot"></span>
          <span class="label">Connecting...</span>
        </div>
        <fluent-button id="mini-mode-toggle" appearance="outline">Mini mode</fluent-button>
        <fluent-button id="settings-toggle" appearance="outline">Settings</fluent-button>
      </div>
    </header>

    <button id="mini-restore" title="Restore PulseGuard">&#10530;</button>

    <div id="settings-panel" hidden>
      <fluent-card class="settings-group">
        <h3>RAM</h3>
        <label>
          Ceiling (%)
          <fluent-text-field id="field-ram-ceiling" type="number"></fluent-text-field>
        </label>
        <label>
          Delta threshold (GB)
          <fluent-text-field id="field-ram-delta" type="number"></fluent-text-field>
        </label>
      </fluent-card>

      <fluent-card class="settings-group">
        <h3>CPU</h3>
        <label>
          Ceiling (%)
          <fluent-text-field id="field-cpu-ceiling" type="number"></fluent-text-field>
        </label>
        <label>
          Delta threshold (points)
          <fluent-text-field id="field-cpu-delta" type="number"></fluent-text-field>
        </label>
      </fluent-card>

      <fluent-card class="settings-group">
        <h3>GPU</h3>
        <label>
          Ceiling (%)
          <fluent-text-field id="field-gpu-ceiling" type="number"></fluent-text-field>
        </label>
        <label>
          Delta threshold (points)
          <fluent-text-field id="field-gpu-delta" type="number"></fluent-text-field>
        </label>
      </fluent-card>

      <fluent-card class="settings-group">
        <h3>General</h3>
        <label class="switch-row">
          Notifications
          <fluent-switch id="field-notifications"></fluent-switch>
        </label>
        <label class="switch-row">
          Start with Windows
          <fluent-switch id="field-autostart"></fluent-switch>
        </label>
      </fluent-card>

      <fluent-card id="settings-footer">
        <label>
          Poll interval (s)
          <fluent-text-field id="field-poll" type="number"></fluent-text-field>
        </label>
        <fluent-button id="settings-save" appearance="accent">Save</fluent-button>
      </fluent-card>
    </div>

    <section class="ring-cluster pg-panel">
      <pulse-ring id="ring-ram" label="RAM"></pulse-ring>
      <pulse-ring id="ring-cpu" label="CPU"></pulse-ring>
      <pulse-ring id="ring-gpu" label="GPU"></pulse-ring>
    </section>

    <section class="io-cluster">
      <fluent-card class="io-card">
        <h3>Disk</h3>
        <div class="io-row"><span class="io-label">Read</span><span id="disk-read" class="io-value pg-mono">-</span></div>
        <div class="io-row"><span class="io-label">Write</span><span id="disk-write" class="io-value pg-mono">-</span></div>
      </fluent-card>
      <fluent-card class="io-card">
        <h3>Network</h3>
        <div class="io-row"><span class="io-label">Down</span><span id="net-recv" class="io-value pg-mono">-</span></div>
        <div class="io-row"><span class="io-label">Up</span><span id="net-sent" class="io-value pg-mono">-</span></div>
      </fluent-card>
    </section>

    <section class="pg-panel panel">
      <div class="panel-header">
        <h2>Timeline</h2>
        <label class="switch-row" id="combined-toggle-row">
          Show all
          <fluent-switch id="combined-toggle"></fluent-switch>
        </label>
      </div>
      <spike-chart id="chart"></spike-chart>
    </section>

    <fluent-card class="panel">
      <div class="panel-header">
        <h2 id="process-panel-title">Top processes at last spike</h2>
        <label class="switch-row">
          Live view
          <fluent-switch id="live-view-toggle"></fluent-switch>
        </label>
      </div>
      <process-list id="process-list"></process-list>
    </fluent-card>

    <alert-toast id="toast"></alert-toast>

    <script src="vendor/chart.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
