name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual fallback for when a tag push doesn't reliably trigger the push
  # event (has happened intermittently) -- dispatch against the tag ref
  # itself (e.g. `gh workflow run release.yml --ref v0.29.0`) and
  # github.ref_name below resolves the same as a real tag push would.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: backend
        run: pyinstaller pulseguard.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Download WebView2 Evergreen bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\redist | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer\redist\MicrosoftEdgeWebView2Setup.exe"

      - name: Compute version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer\pulseguard.iss

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer\Output\PulseGuardSetup.exe
          generate_release_notes: true
